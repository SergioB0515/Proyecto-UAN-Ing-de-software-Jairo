# Integración continua. Tres trabajos:
#
#   backend       — las pruebas contra un PostgreSQL real, en una base nueva.
#                   Prueba una INSTALACIÓN nueva.
#   actualizacion — crea el esquema con el código de la rama base, lo migra
#                   con el de este commit y vuelve a correr las pruebas.
#                   Prueba una ACTUALIZACIÓN, que es lo que hace un despliegue.
#   frontend      — que el SPA compile.
name: CI

on:
  push:
  pull_request:

jobs:
  backend:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: renta_test_db
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    defaults:
      run:
        working-directory: backend
    env:
      TEST_DATABASE_URL: postgresql://postgres:postgres@localhost:5432/renta_test_db
      JWT_SECRET_KEY: clave-solo-para-ci
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - run: pip install -r requirements.txt
      - run: pytest -q

  actualizacion:
    # Por qué este trabajo existe aparte del de arriba.
    #
    # El trabajo `backend` levanta un contenedor de Postgres nuevo en cada
    # corrida: la base nace vacía y el esquema se crea completo de una vez. En
    # una base así, un defecto de migración NO EXISTE. Los dos que llegaron a
    # producción eran de esa familia: `create_all` no agrega columnas a una
    # tabla que ya existe, ni valores a un tipo ENUM que ya existe.
    #
    # Este trabajo parte del esquema que está desplegado y le corre las
    # migraciones encima, que es lo que de verdad pasa en un despliegue.
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: renta_test_db
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      TEST_DATABASE_URL: postgresql://postgres:postgres@localhost:5432/renta_test_db
      JWT_SECRET_KEY: clave-solo-para-ci
      PYTHON: python
    steps:
      - uses: actions/checkout@v4
        with:
          # Hace falta el historial para crear el árbol de la rama base.
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - run: pip install -r backend/requirements.txt
      - name: Prueba de actualización
        run: >-
          herramientas/prueba-actualizacion.sh
          "${{ github.event.pull_request.base.sha || github.event.before }}"

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run build