# Levanta la aplicación completa (API + SPA + PostgreSQL) con un comando:
#
#     cp despliegue/variables-de-entorno.ejemplo .env     # y ajusta las claves
#     docker compose up -d --build
#     docker compose exec api python semilla_demo.py
#
# Queda en http://localhost:8000
#
# Este mismo archivo sirve en el servidor: ahí se añade el perfil `proxy`
# para que Caddy ponga HTTPS automático delante (ver despliegue/README.md).

services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-renta}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?define POSTGRES_PASSWORD en .env}
      POSTGRES_DB: ${POSTGRES_DB:-renta_db}
    volumes:
      - datos_postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-renta} -d ${POSTGRES_DB:-renta_db}"]
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    build: .
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-renta}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB:-renta_db}
      JWT_SECRET_KEY: ${JWT_SECRET_KEY:?define JWT_SECRET_KEY en .env}
      JWT_EXPIRACION_MINUTOS: ${JWT_EXPIRACION_MINUTOS:-120}
      # Mismo origen: el SPA se sirve desde este contenedor, no hay CORS.
      ORIGENES_PERMITIDOS: ${ORIGENES_PERMITIDOS:-}
      # Deja vacías estas dos en un despliegue que no sea de demostración.
      SEMBRAR_DEMO_AL_ARRANCAR: ${SEMBRAR_DEMO_AL_ARRANCAR:-}
      DEMO_RESET_TOKEN: ${DEMO_RESET_TOKEN:-}
    volumes:
      - datos_adjuntos:/datos/almacen
    ports:
      - "${PUERTO_PUBLICO:-8000}:8000"

  # Perfil opcional: HTTPS automático con Let's Encrypt. Solo en el servidor.
  #   DOMINIO=renta.tudominio.com docker compose --profile proxy up -d
  caddy:
    image: caddy:2-alpine
    profiles: ["proxy"]
    restart: unless-stopped
    depends_on: [api]
    environment:
      DOMINIO: ${DOMINIO:?define DOMINIO para usar el perfil proxy}
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./despliegue/Caddyfile:/etc/caddy/Caddyfile:ro
      - datos_caddy:/data
      - config_caddy:/config

volumes:
  datos_postgres:
  datos_adjuntos:
  datos_caddy:
  config_caddy:
