# Blueprint de Render: New -> Blueprint -> este repositorio.
# Plan Free: el servicio se suspende, el disco no persiste y la base caduca a los 30 días.

services:
  - type: web
    name: app-renta-contador
    runtime: docker
    plan: free
    region: virginia
    dockerfilePath: ./Dockerfile
    dockerContext: .
    healthCheckPath: /salud
    autoDeployTrigger: commit
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: renta-db
          property: connectionString
      - key: JWT_SECRET_KEY
        generateValue: true
      - key: JWT_EXPIRACION_MINUTOS
        value: "120"
      # Siembra la demo y regenera los adjuntos en cada arranque.
      - key: SEMBRAR_DEMO_AL_ARRANCAR
        value: "1"
      # Habilita POST /api/demo/reiniciar (cabecera X-Demo-Token).
      - key: DEMO_RESET_TOKEN
        generateValue: true
      - key: ORIGENES_PERMITIDOS
        value: ""
      # Un proxy (el de Render) delante de la app: la IP del cliente es la
      # última entrada de X-Forwarded-For. Ver core/red.py.
      - key: PROXIES_CONFIABLES
        value: "1"

databases:
  - name: renta-db
    plan: free
    databaseName: renta_db
    user: renta
    region: virginia
    # Plan free: expira a los 30 días; la demo se vuelve a sembrar sola.

# Adjuntos persistentes: plan starter y disco montado en /datos/almacen
# (ALMACEN_ADJUNTOS del Dockerfile).
